name: Bug Report / Compilation Issue
description: File a compilation failure, package bug, or visual discrepancy
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ratex! An automated bot will test your snippet immediately upon submission.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal TeX Reproduction
      description: Provide a minimal, self-contained `.tex` code snippet.
      placeholder: |
        \documentclass{article}
        \usepackage{...}
        \begin{document}
        ...
        \end{document}
      render: latex
    validations:
      required: true
  - type: textarea
    id: error-log
    attributes:
      label: Error or Expected Behavior
      description: What went wrong, or what does TeX Live produce that Ratex does not?
      placeholder: Error message or unexpected output
    validations:
      required: false
