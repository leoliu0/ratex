name: Feature Request
description: Suggest a new feature, primitive, or toolchain improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What capability or primitive would you like Ratex to support?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Motivation
      description: How would this improve your workflow or which packages rely on this?
    validations:
      required: false
