name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  libraries:
    name: C and WebAssembly libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasm build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          cargo install wasm-bindgen-cli --version 0.2.122 --locked --root target/libtex-tools
      - name: Build libraries
        run: ./scripts/build-libs.sh
      - name: Exercise shared and static C libraries
        run: |
          cc crates/libtex/examples/smoke.c -Itarget/libtex/include -Ltarget/libtex -Wl,-rpath,"$PWD/target/libtex" -ltex -o target/libtex/smoke
          target/libtex/smoke target/libtex/hello.pdf
          cc crates/libtex/examples/smoke.c -Itarget/libtex/include target/libtex/libtex.a -ldl -lpthread -lm -o target/libtex/smoke-static
          target/libtex/smoke-static
      - name: Exercise Node.js module and native PDF parity
        run: |
          node scripts/test-wasm.cjs
          node scripts/test-wasm-web.mjs
      - name: Exercise browser module
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >target/wasm/http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=120000 --dump-dom http://127.0.0.1:8765/examples/wasm/smoke.html >target/wasm/browser.html
          python3 -c 'from pathlib import Path; s = Path("target/wasm/browser.html").read_text(); assert "PASS {" in s and "FAIL " not in s.split("<script")[0], s'
      - uses: actions/upload-artifact@v4
        with:
          name: libtex-linux-and-wasm
          path: |
            target/libtex/
            target/wasm/web/
            target/wasm/nodejs/
            target/wasm/fonts/
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run packaging tests (linux only)
        if: runner.os == 'Linux'
        run: python3 scripts/test_package_dist.py

      - name: Build release ratex binary
        run: cargo build --release --bin ratex

      - name: Build Windows alias launcher
        if: runner.os == 'Windows'
        run: cargo build --release --bin xelatex

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pdf.js test dependencies
        run: npm ci --prefix scripts

      - name: Install system test dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils bubblewrap texlive-latex-base texlive-latex-extra texlive-xetex texlive-fonts-recommended texlive-fonts-extra cm-super texlive-science texlive-lang-cjk texlive-lang-chinese texlive-lang-japanese texlive-lang-korean texlive-lang-cyrillic texlive-lang-greek latex-cjk-all lmodern fonts-ipaexfont
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install system test dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install poppler

      - name: Install system test dependencies (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python test dependencies (unix)
        if: runner.os != 'Windows'
        run: python3 -m pip install --upgrade fonttools pillow numpy pypdf

      - name: Install Python test dependencies (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install --upgrade fonttools pillow numpy pypdf

      - name: PDF font validator regressions
        run: python scripts/test_font_validation.py

      - name: Linux full independent-viewer font verification gate
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_fonts.py \
            --ratex target/release/ratex \
            --output target/font-evidence-full \
            --require-isolation \
            --require-pdfjs

      - name: Artifact font smoke (macos)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/test_fonts.py \
            --ratex target/release/ratex \
            --output target/font-evidence-smoke \
            --require-pdfjs \
            --skip-reference \
            --case t1_latin_modern \
            --case t1_cm_super \
            --case t2a_russian \
            --case lgr_greek \
            --case cjkutf8_japanese \
            --case cjkutf8_chinese \
            --case cjkutf8_korean \
            --case issue_3_mapped_truetype \
            --case issue_4_cjkutf8_ja \
            --case issue_5_stmaryrd \
            --case issue_6_bbding \
            --case issue_8_latin_modern \
            --case fontspec_native \
            --case xecjk_native \
            --case opentype_cff \
            --case truetype_collection \
            --case unicode_supplementary \
            --case shaping_features \
            --case font_styles_restoration \
            --case boxes_forms \
            --case unioned_subsets \
            --case xcharter_outlines \
            --case fdsymbol_outline \
            --case image_worker_memory \
            --case stix2_script \
            --case ccicons_outline \
            --case lato_text \
            --case twemojis_pdf \
            --case doclicense_graphic \
            --case bera_outlines \
            --case duckuments_graphics
      - name: Artifact font smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/test_fonts.py `
            --ratex target/release/ratex.exe `
            --output target/font-evidence-smoke `
            --require-pdfjs `
            --skip-reference `
            --case t1_latin_modern `
            --case t1_cm_super `
            --case t2a_russian `
            --case lgr_greek `
            --case cjkutf8_japanese `
            --case cjkutf8_chinese `
            --case cjkutf8_korean `
            --case issue_3_mapped_truetype `
            --case issue_4_cjkutf8_ja `
            --case issue_5_stmaryrd `
            --case issue_6_bbding `
            --case issue_8_latin_modern `
            --case fontspec_native `
            --case xecjk_native `
            --case opentype_cff `
            --case truetype_collection `
            --case unicode_supplementary `
            --case shaping_features `
            --case font_styles_restoration `
            --case boxes_forms `
            --case unioned_subsets `
            --case xcharter_outlines `
            --case fdsymbol_outline `
            --case image_worker_memory `
            --case stix2_script `
            --case ccicons_outline `
            --case lato_text `
            --case twemojis_pdf `
            --case doclicense_graphic `
            --case bera_outlines `
            --case duckuments_graphics
      - name: Package distribution (linux)
        if: runner.os == 'Linux'
        run: python3 scripts/package_dist.py --platform linux --arch x86_64

      - name: Test extracted archive distribution (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/ci-archive-test
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/ci-archive-test
          EXTRACTED_RATEX=$(ls -d /tmp/ci-archive-test/tex-suite-*/bin/ratex | head -n1)
          "$EXTRACTED_RATEX" --version
          python3 scripts/test_fonts.py \
            --ratex "$EXTRACTED_RATEX" \
            --output /tmp/font-smoke-archive \
            --require-pdfjs \
            --skip-reference
          rm -rf /tmp/ci-archive-test /tmp/font-smoke-archive

      - name: Test shell installer end-to-end (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/ci-install-test
          ./install.sh --prefix /tmp/ci-install-test --no-path --skip-verify
          /tmp/ci-install-test/bin/ratex --version
          python3 scripts/test_fonts.py \
            --ratex /tmp/ci-install-test/bin/ratex \
            --output /tmp/font-smoke-installed \
            --require-pdfjs \
            --skip-reference
          rm -rf /tmp/ci-install-test /tmp/font-smoke-installed

      - name: Package distribution (macos)
        if: runner.os == 'macOS'
        run: python3 scripts/package_dist.py --platform macos

      - name: Test extracted archive distribution (macos)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/ci-archive-test
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/ci-archive-test
          EXTRACTED_RATEX=$(ls -d /tmp/ci-archive-test/tex-suite-*/bin/ratex | head -n1)
          "$EXTRACTED_RATEX" --version
          python3 scripts/test_fonts.py \
            --ratex "$EXTRACTED_RATEX" \
            --output /tmp/font-smoke-archive \
            --require-pdfjs \
            --skip-reference

      - name: Package distribution (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/package_dist.py --platform windows --arch x86_64

      - name: Test extracted archive distribution (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveZip = (Get-Item dist/tex-suite-*.zip).FullName
          $testDir = "$env:RUNNER_TEMP\ci-archive-test"
          Expand-Archive -Path $archiveZip -DestinationPath $testDir
          $extractedRatex = (Get-Item "$testDir\tex-suite-*\bin\ratex.exe").FullName
          & $extractedRatex --version
          python scripts/test_fonts.py `
            --ratex $extractedRatex `
            --output "$env:RUNNER_TEMP\font-smoke-archive" `
            --require-pdfjs `
            --skip-reference
          if ($LASTEXITCODE -ne 0) { throw "Archive font verification failed" }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-archive" -ErrorAction SilentlyContinue
      - name: Stage bundled assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/share/tex-suite/texmf
          if [ -f crates/tex-kpse/assets/packages.tar.zst ]; then
            tar --zstd -xf crates/tex-kpse/assets/packages.tar.zst -C target/share/tex-suite/texmf
          else
            cat crates/tex-kpse/assets/packages.tar.zst.* | tar --zstd -xf - -C target/share/tex-suite/texmf
          fi
          python3 -c '
          import os
          from pathlib import Path
          root = Path("target/share/tex-suite/texmf")
          lines = ["% ls-R", ""]
          for dirpath, _, filenames in os.walk(root):
              rel = Path(dirpath).relative_to(root).as_posix()
              prefix = f"./{rel}" if rel != "." else "./"
              lines.append(f"{prefix}:")
              for f in sorted(filenames):
                  if f != "ls-R": lines.append(f)
              lines.append("")
          (root / "ls-R").write_text("\n".join(lines))
          '

      - name: Test 10 real-world arXiv papers (zero TeX Live)
        if: runner.os == 'Linux'
        run: python3 scripts/test_arxiv_ci.py --ratex target/release/ratex
