name: Publish Homebrew

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate formula from published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_homebrew.py
      - name: Install and exercise Homebrew formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap leoliu0/ratex "$PWD"
          brew install leoliu0/ratex/ratex
          brew test leoliu0/ratex/ratex
      - name: Publish verified formula
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ratex.rb
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Homebrew formula for latest release'
            git push origin HEAD:main
          fi
