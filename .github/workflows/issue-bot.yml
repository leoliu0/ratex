name: Issue Assistant Bot

# Security model: issue and comment bodies are untrusted.
# - Untrusted text never reaches a `${{ }}` expression inside a script; it
#   travels through files and environment variables only.
# - The snippet compiles in a job whose token can only read the repository,
#   as a separate unprivileged user with an empty environment, so a document
#   that reads or writes arbitrary paths (\input, \openout) can neither reach
#   the runner's credentials nor modify files used by later steps.
# - Secrets and the issue-write token live in a second job that never runs
#   untrusted code.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: issue-bot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reproduce:
    name: Reproduce snippet
    if: >
      !github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'issues' ||
       contains(github.event.comment.body, '/fix') ||
       contains(github.event.comment.body, '/reproduce') ||
       contains(github.event.comment.body, '/test'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      has_snippet: ${{ steps.extract.outputs.has_snippet }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read issue context and TeX snippet
        id: extract
        run: |
          python3 scripts/issue_bot.py prepare \
            --event "$GITHUB_EVENT_PATH" \
            --directory "$RUNNER_TEMP/reproduction"

      - name: Setup Rust toolchain
        if: steps.extract.outputs.has_snippet == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build ratex
        if: steps.extract.outputs.has_snippet == 'true'
        run: cargo build --release --locked --bin ratex

      - name: Compile snippet as an unprivileged user
        if: steps.extract.outputs.has_snippet == 'true'
        run: |
          out="$RUNNER_TEMP/reproduction"
          sudo useradd --create-home --shell /usr/sbin/nologin texbot
          sudo install -d -o texbot -g texbot /home/texbot/work
          sudo install -m 0755 target/release/ratex /home/texbot/ratex
          sudo install -m 0644 -o texbot -g texbot "$out/test.tex" /home/texbot/work/test.tex
          python3 scripts/issue_bot.py reproduce \
            --directory "$out" \
            --binary /home/texbot/ratex \
            --work /home/texbot/work \
            --user texbot

      - name: Upload reproduction result
        uses: actions/upload-artifact@v4
        with:
          name: reproduction
          path: ${{ runner.temp }}/reproduction/
          if-no-files-found: error
          retention-days: 7

  reply:
    name: Reply on issue
    needs: reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      REPRO_DIR: ${{ github.workspace }}/reproduction
    steps:
      - name: Checkout trusted bot helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download reproduction result
        uses: actions/download-artifact@v4
        with:
          name: reproduction
          path: ${{ github.workspace }}/reproduction

      # Ask Gemini to analyze a compilation failure.
      - name: AI Diagnosis with Gemini 3.8 Flash
        if: needs.reproduce.outputs.has_snippet == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/issue_bot.py diagnose --directory "$REPRO_DIR"

      - name: Compose context-aware reply
        run: python3 scripts/issue_bot.py reply --directory "$REPRO_DIR"

      - name: Reply to issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reply = JSON.parse(fs.readFileSync(path.join(process.env.REPRO_DIR, 'reply.json'), 'utf8'));
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            if (reply.labels.length) {
              try {
                await github.rest.issues.addLabels({...issue, labels: reply.labels});
              } catch (e) {
                core.warning(`Could not add labels: ${e.message}`);
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {...issue, per_page: 100});
            const previous = comments.reverse().find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes('Ratex Bot Reproduction Report') ||
               comment.body.includes('Ratex Bot Issue Review') ||
               comment.body.includes('minimal self-contained `.tex` reproduction snippet')));
            const body = reply.body.slice(0, 65000);
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({...issue, body});
            }
