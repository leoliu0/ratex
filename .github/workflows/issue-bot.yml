name: Issue Assistant Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  ai-triage-and-fix:
    if: >
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       !contains(github.event.comment.user.login, '[bot]') &&
       (contains(github.event.comment.body, '/fix') ||
        contains(github.event.comment.body, '/reproduce') ||
        contains(github.event.comment.body, '/test')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Extract code snippet from issue body and attempt reproduction with ratex
      - name: Test TeX Reproduction Snippet
        id: test-tex
        run: |
          python3 - << 'EOF'
          import os, re, subprocess, json

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if not event_path or not os.path.exists(event_path):
              exit(0)

          with open(event_path) as f:
              data = json.load(f)

          body = ""
          if "comment" in data:
              body = data["comment"].get("body", "")
          elif "issue" in data:
              body = data["issue"].get("body", "")

          snippets = re.findall(r'```(?:tex|latex)?\s*([\s\S]*?)```', body)
          if not snippets and "\\documentclass" in body:
              snippets = [body]

          if snippets:
              tex_code = snippets[0].strip()
              os.makedirs("/tmp/reproduce", exist_ok=True)
              with open("/tmp/reproduce/test.tex", "w") as f:
                  f.write(tex_code)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_snippet=true\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_snippet=false\n")
          EOF

      # If snippet was found, compile ratex and test reproduction
      - name: Compile and Test Reproduction
        if: steps.test-tex.outputs.has_snippet == 'true'
        id: run-reproduce
        run: |
          cargo build --release --bin ratex
          set +e
          OUTPUT=$(/home/runner/work/ratex/ratex/target/release/ratex /tmp/reproduce/test.tex 2>&1)
          EXIT_CODE=$?
          echo "RATE_EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          echo "LOG_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" | head -n 40 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Call Gemini 3.8 Flash to analyze compilation failure or answer question
      - name: AI Diagnosis with Gemini 3.8 Flash
        if: steps.test-tex.outputs.has_snippet == 'true' && steps.run-reproduce.outputs.RATE_EXIT_CODE != '0' && env.GEMINI_API_KEY != ''
        id: gemini-ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              exit(0)

          tex_snippet = ""
          if os.path.exists("/tmp/reproduce/test.tex"):
              with open("/tmp/reproduce/test.tex") as f:
                  tex_snippet = f.read()

          logs = """${{ steps.run-reproduce.outputs.LOG_OUTPUT }}"""

          prompt = f"""You are the automated AI maintainer for 'ratex', an ultra-fast, pure-Rust TeX engine.
A user reported a compilation failure on the following snippet:

LaTeX Snippet:
```latex
{tex_snippet}
```

Ratex Compiler Error:
```text
{logs}
```

Please analyze:
1. What went wrong (root cause in TeX/LaTeX or missing package/macro behavior).
2. A suggested workaround for the user in their LaTeX document.
3. Keep your response concise, friendly, and formatted in clean markdown."""

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key={api_key}"
          req = urllib.request.Request(
              url,
              data=json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  res = json.loads(resp.read().decode("utf-8"))
                  candidates = res.get("candidates", [])
                  if candidates:
                      analysis = candidates[0]["content"]["parts"][0]["text"]
                      with open("/tmp/gemini_analysis.md", "w") as f:
                          f.write(analysis)
          except Exception as e:
              print(f"Gemini API error: {e}")
          EOF

      # Reply to Issue
      - name: Reply to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const isComment = context.eventName === 'issue_comment';
            const issueNumber = context.issue.number;
            const hasSnippet = '${{ steps.test-tex.outputs.has_snippet }}' === 'true';
            const exitCode = '${{ steps.run-reproduce.outputs.RATE_EXIT_CODE }}';
            const logs = `${{ steps.run-reproduce.outputs.LOG_OUTPUT }}`;
            const author = isComment ? context.payload.comment.user.login : context.payload.issue.user.login;

            if (author.includes('[bot]') && !isComment) return;

            let geminiAdvice = '';
            if (fs.existsSync('/tmp/gemini_analysis.md')) {
              geminiAdvice = '\n\n---\n\n### 🧠 Gemini 3.8 Flash AI Diagnosis\n\n' + fs.readFileSync('/tmp/gemini_analysis.md', 'utf8');
            }

            let message = '';
            if (hasSnippet) {
              if (exitCode === '0') {
                message = `🤖 **Ratex Bot Reproduction Report**

I ran your minimal reproduction snippet against the current \`main\` branch of \`ratex\`:

✅ **Compiled Successfully (Exit Code 0)**

\`\`\`text
${logs}
\`\`\`

The document compiled without fatal errors. If you are experiencing visual bugs or unexpected layout differences compared to TeX Live, please provide a comparison screenshot or mention the specific output discrepancy.`;
              } else {
                message = `🤖 **Ratex Bot Reproduction Report**

I reproduced the error against the current \`main\` branch of \`ratex\`:

❌ **Compilation Failed (Exit Code ${exitCode})**

\`\`\`text
${logs}
\`\`\`${geminiAdvice}

This issue has been labeled as \`reproduced-bug\` and flagged for investigation.`;

                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: ['bug', 'reproduced']
                  });
                } catch (e) {}
              }
            } else {
              if (!isComment && author !== 'leoliu0') {
                message = `Hi @${author}! 👋 Thanks for opening this issue.

To help diagnose and fix this quickly, please provide a **minimal self-contained \`.tex\` reproduction snippet** wrapped in triple backticks:

\`\`\`latex
\\documentclass{article}
\\begin{document}
% Your minimal snippet reproducing the error
\\end{document}
\`\`\`

As soon as a code snippet is provided, I will automatically test and verify it against \`ratex\`.`;
              }
            }

            if (message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: message
              });
            }
