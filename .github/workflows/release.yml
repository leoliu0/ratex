name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
            ext: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            platform: macos
            arch: x86_64
            ext: tar.gz
          - os: macos-15
            label: macos-aarch64
            platform: macos
            arch: aarch64
            ext: tar.gz
          - os: windows-latest
            label: windows-x86_64
            platform: windows
            arch: x86_64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Check all targets and regression tests
        run: |
          cargo check --workspace --all-targets --locked
          cargo test -p tex-kpse --lib --locked
          cargo test -p tex-core --test review_regressions --locked
          cargo test -p tex-core --test boot_debug test_load_default_fmt_blob --locked
          cargo test -p tex-cli --test driver --locked
          cargo test -p tex-cli --test cache --locked

      - name: Package distribution (unix)
        if: matrix.platform != 'windows'
        run: |
          python3 scripts/package_dist.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"
        shell: bash

      - name: Build Linux packages (.deb, Arch .pkg.tar.zst)
        if: matrix.platform == 'linux'
        shell: bash
        run: python3 scripts/build_linux_packages.py --output-dir dist
      - name: Build macOS native installer (.pkg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p /tmp/pkg-stage
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/pkg-stage
          ./packaging/macos/build-pkg.sh /tmp/pkg-stage/tex-suite-* "${{ matrix.arch }}" "0.1.0" dist


      - name: Package distribution (windows)
        if: matrix.platform == 'windows'
        run: python scripts/package_dist.py --platform windows --arch x86_64
        shell: pwsh
      - name: Build Windows native installer (.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/tex-suite-*.zip).FullName -DestinationPath dist
          iscc packaging/windows/ratex.iss


      - name: Test shell installer end-to-end (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p /tmp/ci-install-test
          ./install.sh --prefix /tmp/ci-install-test --no-path --skip-verify
          /tmp/ci-install-test/bin/ratex --version
          ./install.sh --prefix /tmp/ci-install-test --uninstall
          rm -rf /tmp/ci-install-test

      - name: Test macOS native installer (.pkg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          PKG_FILE=$(ls dist/ratex-*-macos-*.pkg | head -n1)
          echo "==> Installing $PKG_FILE..."
          sudo installer -pkg "$PKG_FILE" -target /
          echo "==> Verifying installed ratex binary..."
          /usr/local/bin/ratex --version
          echo "==> Cleaning up installed files..."
          sudo rm -f /usr/local/bin/ratex /usr/local/bin/texmk /usr/local/bin/pdflatex /usr/local/bin/xelatex /usr/local/bin/lualatex /usr/local/bin/bibtex
          sudo rm -rf /usr/local/share/tex-suite
          sudo pkgutil --forget io.github.leoliu0.ratex || true

      - name: Test Linux native package (.deb)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          DEB_FILE=$(ls dist/ratex_*.deb | head -n1)
          echo "==> Installing $DEB_FILE..."
          sudo dpkg -i "$DEB_FILE"
          echo "==> Verifying installed ratex binary..."
          /usr/bin/ratex --version
          echo "==> Purging deb package..."
          sudo dpkg --purge ratex

      - name: Test PowerShell installer script (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $testPrefix = "$PWD\dist\ci-script-test"
          powershell -ExecutionPolicy Bypass -File packaging/install-windows.ps1 -Prefix "$testPrefix" -NoPath -SkipVerify
          & "$testPrefix\bin\ratex.exe" --version
          powershell -ExecutionPolicy Bypass -File packaging/install-windows.ps1 -Prefix "$testPrefix" -Uninstall
          Remove-Item -Recurse -Force "$testPrefix" -ErrorAction SilentlyContinue

      - name: Test Windows native installer (.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = (Get-Item dist/ratex-setup-*-windows-x64.exe).FullName
          $testPrefix = "$PWD\dist\ci-exe-test"
          Write-Host "==> Installing via native Inno Setup installer..."
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES", "/DIR=$testPrefix" -Wait -NoNewWindow
          if (-not (Test-Path "$testPrefix\bin\ratex.exe")) {
            throw "Failed: ratex.exe not found in $testPrefix\bin"
          }
          Write-Host "==> Verifying installed ratex.exe..."
          & "$testPrefix\bin\ratex.exe" --version
          Write-Host "==> Testing uninstaller..."
          $uninstaller = (Get-Item "$testPrefix\unins000.exe").FullName
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -Wait -NoNewWindow
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force "$testPrefix" -ErrorAction SilentlyContinue
      - name: Record checksums
        id: sums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS-${{ matrix.label }}.txt 2>/dev/null || true
          cat SHA256SUMS-${{ matrix.label }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tex-suite-${{ matrix.label }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
