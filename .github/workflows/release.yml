name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  libraries:
    name: Native and WebAssembly libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasm build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          cargo install wasm-bindgen-cli --version 0.2.122 --locked --root target/libtex-tools
      - name: Build and test libraries
        run: |
          ./scripts/build-libs.sh
          cc crates/libtex/examples/smoke.c -Itarget/libtex/include -Ltarget/libtex -Wl,-rpath,"$PWD/target/libtex" -ltex -o target/libtex/smoke
          target/libtex/smoke target/libtex/hello.pdf
          cc crates/libtex/examples/smoke.c -Itarget/libtex/include target/libtex/libtex.a -ldl -lpthread -lm -o target/libtex/smoke-static
          target/libtex/smoke-static
          node scripts/test-wasm.cjs
          node scripts/test-wasm-web.mjs
      - name: Package libraries
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          tar -C target/libtex -czf "dist/libtex-v${version}-linux-x86_64.tar.gz" include libtex.so libtex.a fonts
          tar -C target/wasm -czf "dist/libtex-v${version}-wasm.tar.gz" web nodejs fonts
          cd dist
          sha256sum libtex-* > SHA256SUMS-libraries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libtex-libraries
          path: dist/*
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
            ext: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            platform: macos
            arch: x86_64
            ext: tar.gz
          - os: macos-15
            label: macos-aarch64
            platform: macos
            arch: aarch64
            ext: tar.gz
          - os: windows-latest
            label: windows-x86_64
            platform: windows
            arch: x86_64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pdf.js test dependencies
        run: npm ci --prefix scripts

      - name: Install system test dependencies (linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils bubblewrap texlive-latex-base texlive-latex-extra texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-lang-cjk texlive-lang-chinese texlive-lang-japanese texlive-lang-korean texlive-lang-cyrillic texlive-lang-greek latex-cjk-all lmodern fonts-ipaexfont
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install system test dependencies (macos)
        if: matrix.platform == 'macos'
        run: brew install poppler

      - name: Install system test dependencies (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install poppler --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python test dependencies (unix)
        if: matrix.platform != 'windows'
        run: python3 -m pip install --upgrade fonttools pillow numpy pypdf

      - name: Install Python test dependencies (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python -m pip install --upgrade fonttools pillow numpy pypdf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run packaging tests (linux only)
        if: matrix.platform == 'linux'
        run: python3 scripts/test_package_dist.py

      - name: Linux full independent-viewer font verification gate
        if: matrix.platform == 'linux'
        run: |
          python3 scripts/test_fonts.py \
            --ratex target/release/ratex \
            --output /tmp/font-evidence-full \
            --require-isolation \
            --require-pdfjs

      - name: Package distribution (unix)
        if: matrix.platform != 'windows'
        run: |
          python3 scripts/package_dist.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"
        shell: bash

      - name: Build Linux packages (.deb, Arch .pkg.tar.zst)
        if: matrix.platform == 'linux'
        shell: bash
        run: python3 scripts/build_linux_packages.py --output-dir dist

      - name: Build macOS native installer (.pkg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p /tmp/pkg-stage
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/pkg-stage
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./packaging/macos/build-pkg.sh /tmp/pkg-stage/tex-suite-* "${{ matrix.arch }}" "$VERSION" dist
          rm -rf /tmp/pkg-stage

      - name: Package distribution (windows)
        if: matrix.platform == 'windows'
        run: python scripts/package_dist.py --platform windows --arch x86_64
        shell: pwsh

      - name: Build Windows native installer (.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/tex-suite-*.zip).FullName -DestinationPath dist
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          iscc "/DMyAppVersion=$version" packaging/windows/ratex.iss
          Remove-Item -Recurse -Force dist/tex-suite-windows-* -ErrorAction SilentlyContinue

      - name: Test extracted archive distribution (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p /tmp/ci-archive-test
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/ci-archive-test
          EXTRACTED_RATEX=$(ls -d /tmp/ci-archive-test/tex-suite-*/bin/ratex | head -n1)
          "$EXTRACTED_RATEX" --version
          python3 scripts/test_fonts.py \
            --ratex "$EXTRACTED_RATEX" \
            --output /tmp/font-smoke-archive \
            --skip-reference \
            --case t1_latin_modern \
            --case t1_cm_super \
            --case t2a_russian \
            --case lgr_greek \
            --case cjkutf8_japanese \
            --case cjkutf8_chinese \
            --case cjkutf8_korean \
            --case issue_3_mapped_truetype \
            --case issue_4_cjkutf8_ja \
            --case issue_5_stmaryrd \
            --case issue_6_bbding \
            --case issue_8_latin_modern \
            --case fontspec_native \
            --case xecjk_native \
            --case opentype_cff \
            --case truetype_collection \
            --case unicode_supplementary \
            --case shaping_features \
            --case font_styles_restoration \
            --case boxes_forms \
            --case unioned_subsets
          rm -rf /tmp/ci-archive-test /tmp/font-smoke-archive

      - name: Test extracted archive distribution (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archiveZip = (Get-Item dist/tex-suite-*.zip).FullName
          $testDir = "$env:RUNNER_TEMP\ci-archive-test"
          Expand-Archive -Path $archiveZip -DestinationPath $testDir
          $extractedRatex = (Get-Item "$testDir\tex-suite-*\bin\ratex.exe").FullName
          & $extractedRatex --version
          python scripts/test_fonts.py `
            --ratex $extractedRatex `
            --output "$env:RUNNER_TEMP\font-smoke-archive" `
            --skip-reference `
            --case t1_latin_modern `
            --case t1_cm_super `
            --case t2a_russian `
            --case lgr_greek `
            --case cjkutf8_japanese `
            --case cjkutf8_chinese `
            --case cjkutf8_korean `
            --case issue_3_mapped_truetype `
            --case issue_4_cjkutf8_ja `
            --case issue_5_stmaryrd `
            --case issue_6_bbding `
            --case issue_8_latin_modern `
            --case fontspec_native `
            --case xecjk_native `
            --case opentype_cff `
            --case truetype_collection `
            --case unicode_supplementary `
            --case shaping_features `
            --case font_styles_restoration `
            --case boxes_forms `
            --case unioned_subsets
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-archive" -ErrorAction SilentlyContinue

      - name: Test shell installer end-to-end (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p /tmp/ci-install-test
          ./install.sh --prefix /tmp/ci-install-test --no-path --skip-verify
          /tmp/ci-install-test/bin/ratex --version
          python3 scripts/test_fonts.py \
            --ratex /tmp/ci-install-test/bin/ratex \
            --output /tmp/font-smoke-installed \
            --skip-reference \
            --case t1_latin_modern \
            --case t1_cm_super \
            --case t2a_russian \
            --case lgr_greek \
            --case cjkutf8_japanese \
            --case cjkutf8_chinese \
            --case cjkutf8_korean \
            --case issue_3_mapped_truetype \
            --case issue_4_cjkutf8_ja \
            --case issue_5_stmaryrd \
            --case issue_6_bbding \
            --case issue_8_latin_modern \
            --case fontspec_native \
            --case xecjk_native \
            --case opentype_cff \
            --case truetype_collection \
            --case unicode_supplementary \
            --case shaping_features \
            --case font_styles_restoration \
            --case boxes_forms \
            --case unioned_subsets
          ./install.sh --prefix /tmp/ci-install-test --uninstall
          rm -rf /tmp/ci-install-test /tmp/font-smoke-installed

      - name: Test macOS native installer (.pkg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          PKG_FILE=$(ls dist/ratex-*-macos-*.pkg | head -n1)
          echo "==> Installing $PKG_FILE..."
          sudo installer -pkg "$PKG_FILE" -target /
          echo "==> Verifying installed ratex binary..."
          /usr/local/bin/ratex --version
          python3 scripts/test_fonts.py \
            --ratex /usr/local/bin/ratex \
            --output /tmp/font-smoke-pkg \
            --skip-reference \
            --case t1_latin_modern \
            --case t1_cm_super \
            --case t2a_russian \
            --case lgr_greek \
            --case cjkutf8_japanese \
            --case cjkutf8_chinese \
            --case cjkutf8_korean \
            --case issue_3_mapped_truetype \
            --case issue_4_cjkutf8_ja \
            --case issue_5_stmaryrd \
            --case issue_6_bbding \
            --case issue_8_latin_modern \
            --case fontspec_native \
            --case xecjk_native \
            --case opentype_cff \
            --case truetype_collection \
            --case unicode_supplementary \
            --case shaping_features \
            --case font_styles_restoration \
            --case boxes_forms \
            --case unioned_subsets
          rm -rf /tmp/font-smoke-pkg
          echo "==> Cleaning up installed files..."
          sudo rm -f /usr/local/bin/ratex /usr/local/bin/texmk /usr/local/bin/pdflatex /usr/local/bin/xelatex /usr/local/bin/lualatex /usr/local/bin/bibtex
          sudo rm -rf /usr/local/share/tex-suite
          sudo pkgutil --forget io.github.leoliu0.ratex || true

      - name: Test Linux native package (.deb)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          DEB_FILE=$(ls dist/ratex_*.deb | head -n1)
          echo "==> Installing $DEB_FILE..."
          sudo dpkg -i "$DEB_FILE"
          echo "==> Verifying installed ratex binary..."
          /usr/bin/ratex --version
          python3 scripts/test_fonts.py \
            --ratex /usr/bin/ratex \
            --output /tmp/font-smoke-deb \
            --skip-reference \
            --case t1_latin_modern \
            --case t1_cm_super \
            --case t2a_russian \
            --case lgr_greek \
            --case cjkutf8_japanese \
            --case cjkutf8_chinese \
            --case cjkutf8_korean \
            --case issue_3_mapped_truetype \
            --case issue_4_cjkutf8_ja \
            --case issue_5_stmaryrd \
            --case issue_6_bbding \
            --case issue_8_latin_modern \
            --case fontspec_native \
            --case xecjk_native \
            --case opentype_cff \
            --case truetype_collection \
            --case unicode_supplementary \
            --case shaping_features \
            --case font_styles_restoration \
            --case boxes_forms \
            --case unioned_subsets
          rm -rf /tmp/font-smoke-deb
          sudo dpkg --purge ratex

      - name: Test PowerShell installer script (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $testPrefix = "$env:RUNNER_TEMP\ci-script-test"
          powershell -ExecutionPolicy Bypass -File packaging/install-windows.ps1 -Prefix "$testPrefix" -NoPath -SkipVerify
          if ($LASTEXITCODE -ne 0) { throw "PowerShell installation failed" }
          & "$testPrefix\bin\ratex.exe" --version
          python scripts/test_fonts.py `
            --ratex "$testPrefix\bin\ratex.exe" `
            --output "$env:RUNNER_TEMP\font-smoke-script" `
            --skip-reference `
            --case t1_latin_modern `
            --case t1_cm_super `
            --case t2a_russian `
            --case lgr_greek `
            --case cjkutf8_japanese `
            --case cjkutf8_chinese `
            --case cjkutf8_korean `
            --case issue_3_mapped_truetype `
            --case issue_4_cjkutf8_ja `
            --case issue_5_stmaryrd `
            --case issue_6_bbding `
            --case issue_8_latin_modern `
            --case fontspec_native `
            --case xecjk_native `
            --case opentype_cff `
            --case truetype_collection `
            --case unicode_supplementary `
            --case shaping_features `
            --case font_styles_restoration `
            --case boxes_forms `
            --case unioned_subsets
          if ($LASTEXITCODE -ne 0) { throw "Installed font verification failed" }
          powershell -ExecutionPolicy Bypass -File packaging/install-windows.ps1 -Prefix "$testPrefix" -Uninstall
          if ($LASTEXITCODE -ne 0) { throw "PowerShell uninstall failed" }
          Remove-Item -Recurse -Force "$testPrefix" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-script" -ErrorAction SilentlyContinue
      - name: Test Windows native installer (.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = (Get-Item dist/ratex-setup-*-windows-x64.exe).FullName
          $testPrefix = "$env:RUNNER_TEMP\ci-exe-test"
          Write-Host "==> Installing via native Inno Setup installer..."
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES", "/DIR=$testPrefix" -Wait -NoNewWindow
          if (-not (Test-Path "$testPrefix\bin\ratex.exe")) {
            throw "Failed: ratex.exe not found in $testPrefix\bin"
          }
          Write-Host "==> Verifying installed ratex.exe..."
          & "$testPrefix\bin\ratex.exe" --version
          python scripts/test_fonts.py `
            --ratex "$testPrefix\bin\ratex.exe" `
            --output "$env:RUNNER_TEMP\font-smoke-exe" `
            --skip-reference `
            --case t1_latin_modern `
            --case t1_cm_super `
            --case t2a_russian `
            --case lgr_greek `
            --case cjkutf8_japanese `
            --case cjkutf8_chinese `
            --case cjkutf8_korean `
            --case issue_3_mapped_truetype `
            --case issue_4_cjkutf8_ja `
            --case issue_5_stmaryrd `
            --case issue_6_bbding `
            --case issue_8_latin_modern `
            --case fontspec_native `
            --case xecjk_native `
            --case opentype_cff `
            --case truetype_collection `
            --case unicode_supplementary `
            --case shaping_features `
            --case font_styles_restoration `
            --case boxes_forms `
            --case unioned_subsets
          Write-Host "==> Testing uninstaller..."
          $uninstaller = (Get-Item "$testPrefix\unins000.exe").FullName
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -Wait -NoNewWindow
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force "$testPrefix" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-exe" -ErrorAction SilentlyContinue
      - name: Record checksums
        id: sums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS-${{ matrix.label }}.txt
          cat SHA256SUMS-${{ matrix.label }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tex-suite-${{ matrix.label }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, libraries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
