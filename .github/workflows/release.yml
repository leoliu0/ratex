name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to republish after a workflow repair"
        required: true
        type: string

permissions:
  contents: read

# Two runs for the same tag (push + manual republish) must not publish concurrently.
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  PYTHONUTF8: "1"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching version and engine source
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$RELEASE_TAG" = "v$version"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git diff --exit-code "$RELEASE_TAG" HEAD -- Cargo.toml Cargo.lock crates

  libraries:
    name: Native and WebAssembly libraries
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasm build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          # Must match Cargo.lock; installs into ~/.cargo/bin, which rust-cache keeps.
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build and test libraries
        run: |
          ./scripts/build-libs.sh
          cc crates/libtex/examples/smoke.c -Itarget/libtex/include -Ltarget/libtex -Wl,-rpath,"$PWD/target/libtex" -ltex -o target/libtex/smoke
          target/libtex/smoke target/libtex/hello.pdf
          cc crates/libtex/examples/smoke.c -Itarget/libtex/include target/libtex/libtex.a -ldl -lpthread -lm -o target/libtex/smoke-static
          target/libtex/smoke-static
          node scripts/test-wasm.cjs
          node scripts/test-wasm-web.mjs
      - name: Package libraries
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          tar -C target/libtex -czf "dist/libtex-v${version}-linux-x86_64.tar.gz" include libtex.so libtex.a fonts
          tar -C target/wasm -czf "dist/libtex-v${version}-wasm.tar.gz" web nodejs fonts
          cd dist
          sha256sum libtex-* > SHA256SUMS-libraries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libtex-libraries
          path: dist/*
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            platform: linux
            arch: x86_64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            platform: linux
            arch: aarch64
            ext: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            platform: macos
            arch: x86_64
            ext: tar.gz
          - os: macos-15
            label: macos-aarch64
            platform: macos
            arch: aarch64
            ext: tar.gz
          - os: windows-latest
            label: windows-x86_64
            platform: windows
            arch: x86_64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Rust 1.99 failed to assemble the dependency archive on macOS 15 arm64.
          toolchain: ${{ matrix.label == 'macos-aarch64' && '1.98.1' || 'stable' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pdf.js test dependencies
        run: npm ci --prefix scripts

      - name: Install system test dependencies (linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils bubblewrap rpm texlive-latex-base texlive-latex-extra texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-lang-cjk texlive-lang-chinese texlive-lang-japanese texlive-lang-korean texlive-lang-cyrillic texlive-lang-greek latex-cjk-all lmodern fonts-ipaexfont
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install system test dependencies (macos)
        if: matrix.platform == 'macos'
        run: brew install poppler

      - name: Install system test dependencies (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install poppler --no-progress --yes
            if ($LASTEXITCODE -eq 0) {
              "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
              if ((Get-Command pdffonts -ErrorAction SilentlyContinue) -and
                  (Get-Command pdftoppm -ErrorAction SilentlyContinue) -and
                  (Get-Command pdftotext -ErrorAction SilentlyContinue)) {
                break
              }
            }
            if ($attempt -eq 3) { throw "Poppler installation failed or its tools are unavailable" }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Install Python test dependencies (unix)
        if: matrix.platform != 'windows'
        run: python3 -m pip install --upgrade fonttools pillow numpy pypdf

      - name: Install Python test dependencies (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python -m pip install --upgrade fonttools pillow numpy pypdf

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        # ARM release outputs must originate in Bookworm, never a host cache.
        if: matrix.label != 'linux-aarch64'
        with:
          key: ${{ matrix.label }}
          # The macOS job deletes target/release/deps before packaging; saving
          # that gutted tree would only evict useful caches.
          save-if: ${{ matrix.platform != 'macos' }}

      # The macOS 15 arm64 image starts with about 43 GiB free, less than the
      # debug workspace tests need: every test binary that links tex-kpse
      # carries the embedded package archive (about 0.7 GB each, 50 GB in all).
      # Simulator runtimes and the Android SDK are unused here.
      - name: Free runner disk space (macos)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          df -h /
          xcrun simctl runtime delete all
          sudo rm -rf "$HOME/Library/Android/sdk"
          df -h /

      - name: Free runner disk space (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Only texres ships (scripts/package_dist.py BINARIES); the tests below build
      # the rest of the workspace in the test profile.
      - name: Build release binary
        if: matrix.label != 'linux-aarch64'
        run: cargo build --release --locked --bin texres

      - name: Build native ARM64 release binary (Debian 12 / glibc 2.36)
        if: matrix.label == 'linux-aarch64'
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          # Native Docker only: the runner and official image are both ARM64.
          # Run as the runner user so subsequent host tests/packaging can write
          # target outputs. Keep this binary at the usual packaging path.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env CARGO_HOME=/tmp/cargo \
            --env CARGO_BUILD_JOBS \
            --env CARGO_TERM_COLOR \
            --volume "$PWD:/work" --workdir /work \
            rust:1-bookworm bash -euc '
              test "$(uname -m)" = aarch64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"
              cargo build --release --locked --bin texres
              target/release/texres --version
            '

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run packaging tests (linux only)
        if: matrix.platform == 'linux'
        run: python3 scripts/test_package_dist.py

      - name: Release completed Linux test build artifacts
        if: matrix.platform == 'linux'
        run: cargo clean --profile dev

      - name: Verify ARM64 minimum-runtime execution
        if: matrix.label == 'linux-aarch64'
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD/target/release/texres:/usr/local/bin/texres:ro" \
            --volume "$work:/out" --workdir /out \
            debian:12-slim sh -euc '
              test "$(uname -m)" = aarch64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"
              texres --version
              for engine in pdf xelatex lualatex; do
                mkdir "$engine"
                printf "%s\n" "\documentclass{article}" "\begin{document}" \
                  "TeXres ARM64 minimum runtime." "\end{document}" > "$engine/smoke.tex"
                texres "-$engine" --cache-directory "/tmp/cache-$engine" \
                  -output-directory "$engine" "$engine/smoke.tex"
              done
            '
          for engine in pdf xelatex lualatex; do
            text=$(pdftotext "$work/$engine/smoke.pdf" - | tr -d '[:space:]')
            test "$text" = 'TeXresARM64minimumruntime.1'
          done

      - name: Install TeX Live 2026 reference
        if: matrix.platform == 'linux'
        uses: TeX-Live/setup-texlive-action@v3
        with:
          version: 2026
          packages: |
            scheme-basic
            collection-latexrecommended
            collection-latexextra
            collection-fontsrecommended
            collection-fontsextra
            collection-luatex
            collection-xetex
            collection-mathscience
            collection-langcjk
            collection-langchinese
            collection-langjapanese
            collection-langkorean
            collection-langcyrillic
            collection-langgreek
            collection-langspanish

      - name: Linux font and engine compatibility gate
        if: matrix.platform == 'linux'
        run: |
          python3 scripts/test_fonts.py \
            --texres target/release/texres \
            --output /tmp/font-evidence-full \
            --require-isolation \
            --require-pdfjs \
            --timeout 180 \
            --reference-pdflatex "$(command -v pdflatex)" \
            --reference-xelatex "$(command -v xelatex)" \
            --reference-lualatex "$(command -v lualatex)" \
            --reference-texlive 2026

      - name: Preserve engine compatibility evidence
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: engine-compatibility-${{ matrix.label }}
          path: |
            /tmp/font-evidence-full/report.json
            /tmp/font-evidence-full/cases/
          retention-days: 14
          if-no-files-found: ignore

      - name: Package distribution (unix)
        if: matrix.platform != 'windows'
        run: |
          python3 scripts/package_dist.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"
        shell: bash

      - name: Build Linux packages (.deb, .rpm, Arch .pkg.tar.zst)
        if: matrix.platform == 'linux'
        shell: bash
        run: python3 scripts/build_linux_packages.py --output-dir dist --arch '${{ matrix.arch }}'

      - name: Reclaim Rust intermediates before macOS packaging
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          df -h .
          rm -rf target/debug target/release/deps target/release/build target/release/incremental
          df -h .

      - name: Build macOS native installer (.pkg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p /tmp/pkg-stage
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/pkg-stage
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./packaging/macos/build-pkg.sh /tmp/pkg-stage/tex-suite-* "${{ matrix.arch }}" "$VERSION" dist
          rm -rf /tmp/pkg-stage

      - name: Package distribution (windows)
        if: matrix.platform == 'windows'
        run: python scripts/package_dist.py --platform windows --arch x86_64
        shell: pwsh

      - name: Build Windows native installer (.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/tex-suite-*.zip).FullName -DestinationPath dist
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          iscc "/DMyAppVersion=$version" packaging/windows/texres.iss
          Remove-Item -Recurse -Force dist/tex-suite-windows-* -ErrorAction SilentlyContinue

      - name: Test extracted archive distribution (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p /tmp/ci-archive-test
          tar -xzf dist/tex-suite-*.tar.gz -C /tmp/ci-archive-test
          EXTRACTED_TEXRES=$(find /tmp/ci-archive-test -path '*/bin/texres' -type f | head -n1)
          "$EXTRACTED_TEXRES" --version
          python3 scripts/test_fonts.py \
            --texres "$EXTRACTED_TEXRES" \
            --output /tmp/font-smoke-archive \
            --require-pdfjs \
            --timeout 180 \
            --skip-reference
          rm -rf /tmp/ci-archive-test /tmp/font-smoke-archive

      - name: Test extracted archive distribution (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archiveZip = (Get-Item dist/tex-suite-*.zip).FullName
          $testDir = "$env:RUNNER_TEMP\ci-archive-test"
          Expand-Archive -Path $archiveZip -DestinationPath $testDir
          $extractedTeXres = (Get-Item "$testDir\tex-suite-*\bin\texres.exe").FullName
          & $extractedTeXres --version
          python scripts/test_fonts.py `
            --texres $extractedTeXres `
            --output "$env:RUNNER_TEMP\font-smoke-archive" `
            --require-pdfjs `
            --skip-reference
          if ($LASTEXITCODE -ne 0) { throw "Archive font verification failed" }
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-archive" -ErrorAction SilentlyContinue

      - name: Test shell installer end-to-end (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p /tmp/ci-install-test
          ./install.sh --prefix /tmp/ci-install-test --no-path --skip-verify
          /tmp/ci-install-test/bin/texres --version
          python3 scripts/test_fonts.py \
            --texres /tmp/ci-install-test/bin/texres \
            --output /tmp/font-smoke-installed \
            --require-pdfjs \
            --timeout 180 \
            --skip-reference
          ./install.sh --prefix /tmp/ci-install-test --uninstall
          rm -rf /tmp/ci-install-test /tmp/font-smoke-installed

      - name: Test macOS native installer (.pkg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          PKG_FILE=$(find dist -maxdepth 1 -name 'texres-*-macos-*.pkg' | head -n1)
          echo "==> Installing $PKG_FILE..."
          sudo installer -pkg "$PKG_FILE" -target /
          echo "==> Verifying installed texres binary..."
          /usr/local/bin/texres --version
          python3 scripts/test_fonts.py \
            --texres /usr/local/bin/texres \
            --output /tmp/font-smoke-pkg \
            --require-pdfjs \
            --timeout 180 \
            --skip-reference
          rm -rf /tmp/font-smoke-pkg
          echo "==> Cleaning up installed files..."
          sudo rm -f /usr/local/bin/texres /usr/local/bin/texmk /usr/local/bin/pdflatex /usr/local/bin/xelatex /usr/local/bin/lualatex /usr/local/bin/bibtex
          sudo rm -rf /usr/local/share/tex-suite
          sudo pkgutil --forget io.github.leoliu0.texres || true

      - name: Test Linux native package (.deb)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          DEB_FILE=$(find dist -maxdepth 1 -name 'texres_*.deb' | head -n1)
          echo "==> Installing $DEB_FILE..."
          sudo dpkg -i "$DEB_FILE"
          echo "==> Verifying installed texres binary..."
          /usr/bin/texres --version
          python3 scripts/test_fonts.py \
            --texres /usr/bin/texres \
            --output /tmp/font-smoke-deb \
            --require-pdfjs \
            --skip-reference
          rm -rf /tmp/font-smoke-deb
          sudo dpkg --purge texres

      - name: Test PowerShell installer script (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $testPrefix = "$env:RUNNER_TEMP\ci-script-test"
          powershell -ExecutionPolicy Bypass -File packaging/install-windows.ps1 -Prefix "$testPrefix" -NoPath -SkipVerify
          if ($LASTEXITCODE -ne 0) { throw "PowerShell installation failed" }
          & "$testPrefix\bin\texres.exe" --version
          python scripts/test_fonts.py `
            --texres "$testPrefix\bin\texres.exe" `
            --output "$env:RUNNER_TEMP\font-smoke-script" `
            --require-pdfjs `
            --skip-reference
          if ($LASTEXITCODE -ne 0) { throw "Installed font verification failed" }
          powershell -ExecutionPolicy Bypass -File packaging/install-windows.ps1 -Prefix "$testPrefix" -Uninstall
          if ($LASTEXITCODE -ne 0) { throw "PowerShell uninstall failed" }
          Remove-Item -Recurse -Force "$testPrefix" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-script" -ErrorAction SilentlyContinue
      - name: Test Windows native installer (.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = (Get-Item dist/texres-setup-*-windows-x64.exe).FullName
          $testPrefix = "$env:RUNNER_TEMP\ci-exe-test"
          Write-Host "==> Installing via native Inno Setup installer..."
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES", "/DIR=$testPrefix" -Wait -NoNewWindow
          if (-not (Test-Path "$testPrefix\bin\texres.exe")) {
            throw "Failed: texres.exe not found in $testPrefix\bin"
          }
          $installedBin = "$testPrefix\bin"
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $installedBin)) {
            throw "Installer did not add $installedBin to the user PATH"
          }
          Write-Host "==> Verifying installed texres.exe..."
          & "$testPrefix\bin\texres.exe" --version
          python scripts/test_fonts.py `
            --texres "$testPrefix\bin\texres.exe" `
            --output "$env:RUNNER_TEMP\font-smoke-exe" `
            --require-pdfjs `
            --skip-reference
          if ($LASTEXITCODE -ne 0) { throw "Native installer font verification failed" }
          Write-Host "==> Testing uninstaller..."
          $uninstaller = (Get-Item "$testPrefix\unins000.exe").FullName
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES" -Wait -NoNewWindow
          # The uninstaller relaunches itself from %TEMP%; it deletes unins000.exe last.
          for ($i = 0; ($i -lt 60) -and (Test-Path $uninstaller); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$testPrefix\bin\texres.exe") { throw "Uninstaller left texres.exe behind" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $installedBin) {
            throw "Uninstaller left $installedBin in the user PATH"
          }
          Remove-Item -Recurse -Force "$testPrefix" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\font-smoke-exe" -ErrorAction SilentlyContinue
      - name: Record checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > "SHA256SUMS-${{ matrix.label }}.txt"
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tex-suite-${{ matrix.label }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Publish only when every platform and the libraries succeeded: a partial
    # release would reach Homebrew/AUR users. After a flaky failure, use
    # "Re-run failed jobs"; successful jobs keep their artifacts.
    needs: [validate, build, libraries]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Require every platform and library asset, verify checksums
        shell: bash
        working-directory: artifacts
        run: |
          version="${RELEASE_TAG#v}"
          missing=0
          for asset in \
            "tex-suite-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            "tex-suite-${RELEASE_TAG}-linux-aarch64.tar.gz" \
            "tex-suite-${RELEASE_TAG}-macos-x86_64.tar.gz" \
            "tex-suite-${RELEASE_TAG}-macos-aarch64.tar.gz" \
            "tex-suite-${RELEASE_TAG}-windows-x86_64.zip" \
            "texres-${RELEASE_TAG}-macos-x86_64.pkg" \
            "texres-${RELEASE_TAG}-macos-aarch64.pkg" \
            "texres-setup-${RELEASE_TAG}-windows-x64.exe" \
            "texres_${version}_amd64.deb" \
            "texres-${version}-1-x86_64.pkg.tar.zst" \
            "texres-${version}-1.x86_64.rpm" \
            "texres_${version}_arm64.deb" \
            "texres-${version}-1-aarch64.pkg.tar.zst" \
            "texres-${version}-1.aarch64.rpm" \
            "libtex-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            "libtex-${RELEASE_TAG}-wasm.tar.gz" \
            "SHA256SUMS-linux-x86_64.txt" \
            "SHA256SUMS-linux-aarch64.txt" \
            "SHA256SUMS-macos-x86_64.txt" \
            "SHA256SUMS-macos-aarch64.txt" \
            "SHA256SUMS-windows-x86_64.txt" \
            "SHA256SUMS-libraries.txt"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing release asset: $asset"
              missing=1
            fi
          done
          test "$missing" = 0
          sha256sum --strict -c SHA256SUMS-*.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
