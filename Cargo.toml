[workspace]
resolver = "2"
members = [
    "crates/tex-core",
    "crates/tex-kpse",
    "crates/tex-cli",
    "crates/tex-bibtex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
flate2 = "1.0"
libc = "0.2"
rustybuzz = "0.14"
ttf-parser = "0.21"
zstd = "0.13"
tar = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
