[workspace]
resolver = "2"
members = [
    "crates/tex-core",
    "crates/tex-kpse",
    "crates/tex-cli",
    "crates/tex-bibtex",
    "crates/tex-runtime",
    "crates/libtex",
    "crates/tex-wasm",
    "crates/tex-lua",
    "crates/tex-lua-derive",
    "crates/tex-mplib",
    "crates/tex-ps",
]

[workspace.package]
version = "0.4.4"
edition = "2021"

[workspace.dependencies]
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
dlmalloc = { version = "0.2.14", features = ["global"] }
libc = "0.2"
ruzstd = "0.9.0"
rustybuzz = "0.14"
ttf-parser = "0.21"
tar = "0.4"

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
debug = 1
strip = "none"

# C callers must never observe a Rust unwind. Exported entry points catch it.
[profile.ffi-release]
inherits = "release"
panic = "unwind"
