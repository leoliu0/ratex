[package]
name = "tex-biber"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Self-contained Rust biblatex bibliography processor"

[dependencies]
tex-kpse = { path = "../tex-kpse", default-features = false }
roxmltree = "0.20"
md5 = { package = "md-5", version = "0.11" }
unicode-normalization = "0.1"
regex = "1"
fancy-regex = "0.19"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
url = "2.5.4"
# Remote datasources: pure-Rust TLS (ring provider, no native TLS library).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = { workspace = true }

[dev-dependencies]
serde_json = "1"
