[package]
name = "tex-kpse"
version.workspace = true
edition.workspace = true

[dependencies]
ruzstd = { workspace = true }

[build-dependencies]
ruzstd = { workspace = true }
tar = { workspace = true }
ttf-parser = { workspace = true }
[dev-dependencies]
tar = { workspace = true }

[features]
default = ["embed-packages"]
embed-packages = []
# Copy the embedded package library into the rlib so a `staticlib` built from
# this crate contains it. Executables and cdylibs link it from OUT_DIR without.
bundle-packages = ["embed-packages"]
