[package]
name = "tex-lua"
version.workspace = true
edition = "2024"
authors = ["CppCXY", "Ratex contributors"]
description = "In-tree Rust Lua runtime for the Ratex LuaTeX profile"
license = "MIT"
repository = "https://github.com/leoliu0/ratex"
publish = false

[lib]
doctest = false
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
sandbox = []
shared-proto = []

[dependencies]
luars-derive = { package = "tex-lua-derive", path = "../tex-lua-derive" }
chrono = "0.4"
itoa = "1"
libc.workspace = true
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
