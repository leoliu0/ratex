<?xml version="1.0" encoding="UTF-8"?>
<config><sourcemap><maps datatype="bibtex" map_overwrite="1">
<map><map_step map_field_source="note" map_match="^reset-short:(?|(a)|(b)(c)?)(d)?$" map_replace="reset-short:&lt;$1|$2|$3&gt;"/></map>
<map><map_step map_field_source="note" map_match="^reset-nested:(?|(?|(a)|(b))(c)|(d))(e)?$" map_replace="reset-nested:&lt;$1|$2|$3&gt;"/></map>
<map><map_step map_field_source="note" map_match="^reset-repeat:(?|(a)|(b)(c)){2}$" map_replace="reset-repeat:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^reset-ref:(?|(a)|(b))\1$" map_replace="reset-ref:&lt;$1&gt;"/></map>
<map><map_step map_field_source="note" map_match="^duplicate-ref:(?:(?&lt;x&gt;a)|(?&lt;x&gt;b))\k&lt;x&gt;$" map_replace="duplicate-ref:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^duplicate-first:(?&lt;x&gt;a)(?&lt;x&gt;b)\k&lt;x&gt;$" map_replace="duplicate-first:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^relative-backref:(a)(b)\g{-1}\g{-2}$" map_replace="relative-backref:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^relative-sub:(a)(b)(?-2)(?-1)$" map_replace="relative-sub:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^forward-sub:(?+1)(a)(b)$" map_replace="forward-sub:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^define:(?(DEFINE)(?&lt;a&gt;a)(?&lt;b&gt;b))(?&amp;a)(?&amp;b)(?&amp;b)(?&amp;a)$" map_replace="define:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^condition-name:(?:(?&lt;x&gt;a)|b)(?(&lt;x&gt;)c|d)$" map_replace="condition-name:&lt;$1&gt;"/></map>
<map><map_step map_field_source="note" map_match="^condition-negative:a(?(?!c)b|c)$" map_replace="condition-negative:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^quote:\Qa.b\E+$" map_replace="quote:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^n-mode:(?n:(a)(?&lt;x&gt;b))$" map_replace="n-mode:&lt;$1|$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^scope-m:(?m:a)(?-m:b)$$" map_replace="scope-m:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^xx-class:(?xx:[ a \t ])$" map_replace="xx-class:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^octal:(a)\11$" map_replace="octal:&lt;$1&gt;"/></map>
<map><map_step map_field_source="note" map_match="^escaped-class:[a\]]+$" map_replace="escaped-class:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^posix:[[:alpha:]]$" map_replace="posix:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^ascii-posix:(?a:[[:alpha:]])$" map_replace="ascii-posix:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^bare-N:\N$" map_replace="bare-N:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^named-char:\N{LATIN SMALL LETTER A}$" map_replace="named-char:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^mark:a(*MARK:one)b$" map_replace="mark:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^accept-arg:a(*ACCEPT:one)c$" map_replace="accept-arg:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^atomic-verb:(*atomic:a)b$" map_replace="atomic-verb:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^look-verb:(*pla:a)a(*nlb:c)b$" map_replace="look-verb:&lt;hit&gt;"/></map>
<map><map_step map_field_source="note" map_match="^locale:(?l:\w)$" map_replace="locale:&lt;hit&gt;"/></map>
</maps></sourcemap></config>
