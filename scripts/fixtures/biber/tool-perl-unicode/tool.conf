<?xml version="1.0" encoding="UTF-8"?>
<config><sourcemap><maps datatype="bibtex" map_overwrite="1">
<map><map_step map_field_source="note" map_match="(?i)^(literal-sharp):(strasse)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(reverse-sharp):(straße)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(class-sharp):([ß])$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(class-partial):([s])$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(ligature):(ffi)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(dotted):(i\x{307})$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(kelvin):(k)$" map_replace="$1:&lt;$2&gt;"/></map>
