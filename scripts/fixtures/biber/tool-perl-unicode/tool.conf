<map><map_step map_field_source="note" map_match="^(regional):(\X)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(fold-backref):(Straße)-\2$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(dotless):(i)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(negated-sharp):([^ß])$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(not-cased):(\P{Ll})$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(long-s):(s)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?iaa)^(ascii-long-s):(s)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(greek-fold):(ι\x{308}\x{301})$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(class-order):([sß])(s?)$" map_replace="$1:&lt;$2|$3&gt;"/></map>
<map><map_step map_field_source="note" map_match="^vertical-escaped:a-b$" map_replace="vertical-escaped:a\x{2028}b"/></map>
<map><map_step map_field_source="note" map_match="^(vertical-escaped):(a\vb)$" map_replace="$1:&lt;$2&gt;"/></map>
</maps></sourcemap></config>
