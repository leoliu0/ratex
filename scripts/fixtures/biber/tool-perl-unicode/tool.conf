<map><map_step map_field_source="note" map_match="^(word):(\b\w+\b)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^(mark):(\w)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^(horizontal):(a\hb)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^(vertical):(a\vb)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^(kawi):(\p{Script=Kawi})$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="^(new-digit):(\d)$" map_replace="$1:&lt;$2&gt;"/></map>
<map><map_step map_field_source="note" map_match="(?i)^(cased):(\p{Ll})$" map_replace="$1:&lt;$2&gt;"/></map>
